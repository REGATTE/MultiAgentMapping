name: b
from_domain: 2
to_domain: 0
topics:
  /b/distributedMapping/keyposeCloud:
    type: sensor_msgs/msg/PointCloud2
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 1
  /b/distributedMapping/loopInfo:
    type: multi_agent_mapping/msg/LoopInfo
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 50
  /b/lio_sam/mapping/odometry:
    type: nav_msgs/msg/Odometry
    qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 50
      deadline: 0
      lifespan: 0
      liveliness: automatic
      liveliness_lease_duration: 0
  /tf:
    type: tf2_msgs/msg/TFMessage
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
    transform_rules:
      - frame_id: world
        child_frame_id: b/odom 
        action: pass
      - frame_id: b/odom
        child_frame_id: b/lidar_link
        action: pass
      - frame_id: .*
        child_frame_id: .*
        action: block